name: Verify

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-known-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intact_verify
          POSTGRES_USER: intact
          POSTGRES_PASSWORD: intact_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intact -d intact_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://intact:intact_verify@localhost:5432/intact_verify?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            client/yarn.lock
            server/chat/yarn.lock

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/riro-bridge/requirements.txt

      - name: Install client dependencies
        run: yarn --cwd client install --frozen-lockfile --non-interactive

      - name: Install realtime dependencies
        run: yarn --cwd server/chat install --frozen-lockfile --non-interactive

      - name: Install Python dependencies
        run: python3 -m pip install --requirement server/riro-bridge/requirements.txt

      - name: Run aggregate verification gate
        run: bash scripts/verify.sh
